name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js 22.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run test suite
        run: npm test
