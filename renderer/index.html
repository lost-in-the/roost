<!doctype html>
<html lang="en" data-state="boot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>roost</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- Hazard texture used by the stalled state. Inline so nothing is fetched. -->
<svg width="0" height="0" aria-hidden="true">
  <defs>
    <pattern id="hazard" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="28" fill="currentColor" opacity="0.5"></rect>
    </pattern>
  </defs>
</svg>

<main id="panel">
  <header class="bar">
    <span class="glyph" id="glyph" aria-hidden="true"></span>
    <h1 class="state" id="state-name">connecting</h1>
    <span class="count" id="count" hidden></span>
    <span class="clock" id="clock"></span>
    <span class="link" id="link" title="broker connection"></span>
  </header>

  <p class="label" id="label"></p>

  <!-- Activity strip: ANIMATED while thinking, FROZEN while stalled.
       Motion versus stillness is the cue that reads from across the room. -->
  <div class="activity" id="activity" aria-hidden="true">
    <div class="activity-fill"></div>
    <svg class="activity-hazard" aria-hidden="true"><rect width="100%" height="100%" fill="url(#hazard)"></rect></svg>
  </div>

  <footer class="bar bottom">
    <span class="elapsed" id="elapsed"></span>

    <!-- The measurement instrument for the project's success metric. -->
    <button id="laptop" class="laptop" type="button">
      <span class="laptop-icon" aria-hidden="true"></span>
      <span class="laptop-text">had to open<br>the laptop</span>
      <span class="laptop-count" id="laptop-count">—</span>
    </button>
  </footer>

  <!-- Shown when heartbeats stop. Deliberately covers the stale reading:
       a panel you half-believe is worse than one that plainly says it is blind. -->
  <div class="stale" id="stale" aria-hidden="true">
    <span class="stale-title">no signal</span>
    <span class="stale-sub" id="stale-sub"></span>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>

<script type="module" src="/app.js"></script>
</body>
</html>
